<script>
/* =========================================================
   DIVE CENTER RESTO — tampilan (client)
   ========================================================= */
var S = { token: null, user: null, boot: null, tab: 'pos', sub: {}, cart: [], posKat: 'Semua', posCari: '', pos: { diskon: 0, meja: '', pelanggan: '', catatan: '' }, jForm: null, last: {} };

/* ---------- Ikon (stroke SVG) ---------- */
var IC = {
  pos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M12 16v4M7 8h6"/></svg>',
  jurnal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>',
  bb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/></svg>',
  lr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  neraca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8"/></svg>',
  set: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg>',
  dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.5-1.5-2-1-1 1c-1-.5-2-1.5-2.5-2.5l1-1-1-2z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>'
};

/* ---------- Logo B: Emblem Pantai ---------- */
function logoB(full) {
  var id = 'L' + Math.random().toString(36).slice(2, 7);
  var teks = full ? (
    '<path id="' + id + 't" d="M38 150 A112 112 0 0 1 262 150"/><path id="' + id + 'b" d="M22 150 A128 128 0 0 0 278 150"/>') : '';
  var tulisan = full ? (
    '<text font-family="Poppins,sans-serif" font-size="21" font-weight="600" letter-spacing="4" fill="#E8E9EB"><textPath href="#' + id + 't" startOffset="50%" text-anchor="middle">DIVE CENTER RESTO</textPath></text>' +
    '<text font-family="Poppins,sans-serif" font-size="13" font-weight="500" letter-spacing="3.5" fill="#C9CDD2"><textPath href="#' + id + 'b" startOffset="50%" text-anchor="middle">COFFEE · SEA · KITCHEN</textPath></text>' +
    '<circle cx="44" cy="150" r="3.5" fill="#C9CDD2"/><circle cx="256" cy="150" r="3.5" fill="#C9CDD2"/>' +
    '<text x="150" y="88" font-family="Poppins,sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#E8E9EB" text-anchor="middle">NUSA PENIDA</text>') : '';
  var vb = full ? '0 0 300 300' : '52 52 196 196';
  return '<svg viewBox="' + vb + '" role="img" aria-label="Logo Dive Center Resto"><defs>' + teks +
    '<clipPath id="' + id + 'd"><circle cx="150" cy="150" r="94"/></clipPath><clipPath id="' + id + 's"><rect x="0" y="0" width="300" height="172"/></clipPath></defs>' +
    (full ? '<circle cx="150" cy="150" r="150" fill="#3B4A22"/><circle cx="150" cy="150" r="142" fill="none" stroke="#C9CDD2" stroke-width="4"/>' : '<circle cx="150" cy="150" r="98" fill="#3B4A22"/>') +
    '<circle cx="150" cy="150" r="98" fill="none" stroke="#C9CDD2" stroke-width="' + (full ? 2.5 : 5) + '"/><circle cx="150" cy="150" r="94" fill="#556B2F"/>' + tulisan +
    '<g clip-path="url(#' + id + 'd)"><g clip-path="url(#' + id + 's)"><ellipse cx="150" cy="146" rx="30" ry="40" fill="#D4D8DC"/>' +
    '<path d="M150 106 C134 126 166 152 150 186" fill="none" stroke="#556B2F" stroke-width="5" stroke-linecap="round"/></g>' +
    '<path d="M40 172 H260" stroke="#D4D8DC" stroke-width="3"/>' +
    '<path d="M40 190 Q60 180 80 190 T120 190 T160 190 T200 190 T240 190 T280 190" fill="none" stroke="#B9BEC4" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M40 208 Q60 198 80 208 T120 208 T160 208 T200 208 T240 208 T280 208" fill="none" stroke="#8A9A5B" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M40 226 Q60 216 80 226 T120 226 T160 226 T200 226 T240 226 T280 226" fill="none" stroke="#B9BEC4" stroke-width="4" stroke-linecap="round"/></g></svg>';
}

/* ---------- Util ---------- */
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nf(n) { n = Math.round(Number(n) || 0); var s = Math.abs(n).toLocaleString('id-ID'); return n < 0 ? '−' + s : s; }
function rp(n) { return 'Rp ' + nf(n); }
function num(v) { if (typeof v === 'number') return v; var s = String(v || '').replace(/[^\d-]/g, ''); return Number(s) || 0; }
function $(id) { return document.getElementById(id); }
function val(id) { var e = $(id); return e ? e.value : ''; }
function today() { return S.boot ? S.boot.hariIni : new Date().toISOString().slice(0, 10); }
function awalBulan() { return today().slice(0, 8) + '01'; }
function tglID(t) { if (!t) return ''; var p = String(t).slice(0, 10).split('-'); var b = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des']; return p.length === 3 ? Number(p[2]) + ' ' + b[Number(p[1]) - 1] + ' ' + p[0] : t; }
function can(a) { return S.boot && S.boot.izin.indexOf(a) >= 0; }
function akun(kode) { return S.boot.akun.filter(function (a) { return a.kode === String(kode); })[0]; }
function kontakNama(k) { var x = S.boot.kontak.filter(function (c) { return c.kode === k; })[0]; return x ? x.nama : k; }
function kelBadge(k) { return k === 'ALKOHOL' ? '<span class="badge b-alk">ALKOHOL</span>' : '<span class="badge b-halal">HALAL</span>'; }
function moneyInput(id, v, ph) { return '<input id="' + id + '" inputmode="numeric" class="money" value="' + (v ? nf(v) : '') + '" placeholder="' + (ph || '0') + '" oninput="UI.fmtMoney(this)">'; }
function opt(list, sel) { return list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(sel) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }

var UI = {
  load: function (on) { $('loading').hidden = !on; },
  toast: function (msg, bad) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(UI._t); UI._t = setTimeout(function () { t.className = 'toast'; }, bad ? 5000 : 2800);
  },
  open: function (title, html, wide) {
    $('modalTitle').textContent = title; $('modalBody').innerHTML = html;
    document.querySelector('.modal-box').className = 'modal-box' + (wide ? ' wide' : '');
    $('modal').hidden = false;
  },
  close: function () { $('modal').hidden = true; $('modalBody').innerHTML = ''; },
  fmtMoney: function (el) {
    var neg = /^\s*[-−]/.test(el.value);
    var n = Math.abs(num(el.value));
    el.value = n ? (neg ? '-' : '') + n.toLocaleString('id-ID') : (neg ? '-' : '');
    if (el.dataset.cb) window[el.dataset.cb.split('.')[0]][el.dataset.cb.split('.')[1]](el);
  },
  confirm: function (title, msg, label, fn) {
    UI._cf = fn;
    UI.open(title, '<p>' + msg + '</p><div class="modal-foot"><button class="btn" onclick="UI.close()">Batal</button><button class="btn btn-primary" onclick="var f=UI._cf;UI.close();f()">' + esc(label) + '</button></div>');
  }
};

function call(action, data) {
  return new Promise(function (res, rej) {
    UI.load(true);
    google.script.run.withSuccessHandler(function (r) {
      UI.load(false);
      if (r && r.ok) return res(r.data);
      if (r && r.relogin) { App.logout(true); }
      rej(new Error(r ? r.error : 'Gagal menghubungi server.'));
    }).withFailureHandler(function (e) { UI.load(false); rej(e); }).api({ action: action, token: S.token, data: data || {} });
  });
}
function gagal(e) { UI.toast(e.message || String(e), true); }

/* ---------- Ekspor & cetak ---------- */
function unduhCSV(nama, rows) {
  var csv = rows.map(function (r) { return r.map(function (c) { var s = String(c === undefined || c === null ? '' : c); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';'); }).join('\r\n');
  try {
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nama + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500);
    UI.toast('File ' + nama + '.csv diunduh (buka dengan Excel).');
  } catch (e) { UI.toast('Browser ini tidak mengizinkan unduhan. Gunakan Cetak → Simpan PDF.', true); }
}
function cetakLaporan() { document.body.classList.add('p-lap'); setTimeout(function () { window.print(); document.body.classList.remove('p-lap'); }, 50); }
function tblRows(tableId) {
  var t = $(tableId); if (!t) return [];
  return Array.prototype.map.call(t.querySelectorAll('tr'), function (tr) {
    return Array.prototype.map.call(tr.children, function (td) { var x = td.textContent.trim(); return td.classList.contains('num') && x.indexOf('%') < 0 ? String(num(x.replace('−', '-'))) : x; });
  });
}

/* =========================================================
   LOGIN & SHELL
   ========================================================= */
var App = {
  init: function () {
    $('loginLogo').innerHTML = logoB(true);
    $('loginForm').onsubmit = App.login;
    $('lgErr').textContent = 'Membuka aplikasi…';
    google.script.run.withSuccessHandler(function (r) {
      $('lgErr').textContent = '';
      if (r && r.ok) { S.dev = true; S.token = r.data.token; App.start(); return; }
      S.dev = false;
      try { var t = sessionStorage.getItem('dcr_token'); if (t) { S.token = t; App.start(); } } catch (e) { }
    }).withFailureHandler(function (e) { $('lgErr').textContent = 'Gagal menghubungi server: ' + (e.message || e); })
      .masukTanpaLogin(S.devPeran || 'ADMIN');
  },
  login: function (ev) {
    ev.preventDefault();
    $('lgErr').textContent = ''; $('lgBtn').disabled = true;
    google.script.run.withSuccessHandler(function (r) {
      $('lgBtn').disabled = false;
      if (!r.ok) { $('lgErr').textContent = r.error; return; }
      S.token = r.data.token;
      try { sessionStorage.setItem('dcr_token', S.token); } catch (e) { }
      App.start();
    }).withFailureHandler(function (e) { $('lgBtn').disabled = false; $('lgErr').textContent = e.message; }).login(val('lgKode'), val('lgPin'));
  },
  start: function () {
    call('bootstrap').then(function (b) {
      S.boot = b; S.user = b.user;
      $('login').hidden = true; $('app').hidden = false;
      App.shell();
      var first = TABS.filter(function (t) { return can(t.need); })[0];
      App.go(first ? first.id : 'pos');
      if (S.dev) UI.toast('Mode pengembangan: tanpa login, sebagai ' + S.user.peran + '.');
      else if (S.user.kode === 'ADM') UI.toast('Login awal: segera ganti PIN default lewat menu akun.');
    }).catch(function (e) {
      try { sessionStorage.removeItem('dcr_token'); } catch (x) { }
      $('login').hidden = false; $('app').hidden = true; $('loginForm').onsubmit = App.login;
      $('lgErr').textContent = 'Gagal membuka aplikasi: ' + (e.message || e);
    });
  },
  shell: function () {
    var p = S.boot.pengaturan;
    var brand = logoB(false) + '<div class="brand-txt"><div class="brand-name">' + esc(p.NAMA_RESTO) + '</div><div class="brand-sub">' + esc(String(p.ALAMAT || '').toUpperCase()) + '</div></div>';
    $('sideBrand').innerHTML = brand;
    $('topBrand').innerHTML = brand.replace('brand-name"', 'brand-name" style="color:var(--moss-d)"').replace('brand-sub"', 'brand-sub" style="color:var(--muted)"');
    $('nav').innerHTML = TABS.filter(function (t) { return can(t.need); }).map(function (t) {
      return '<button data-tab="' + t.id + '" onclick="App.go(\'' + t.id + '\')">' + IC[t.icon] + '<span>' + t.short + '</span></button>';
    }).join('');
    var ini = S.user.nama.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    $('btnUser').innerHTML = '<span class="avatar">' + esc(ini) + '</span><span class="uname">' + esc(S.user.kode) + ' · ' + esc(S.user.peran) + '</span>';
    $('btnUser').onclick = App.akunSaya;
    $('sideUser').innerHTML = esc(S.user.nama) + '<br>' + esc(S.user.peran) + ' · ' + tglID(today());
    var setOk = can('penggunaDaftar');
    $('btnSet').hidden = !setOk; $('btnSet').innerHTML = IC.set; $('btnSet').onclick = function () { App.go('set'); };
  },
  go: function (tab) {
    S.tab = tab;
    var t = TABS.concat([{ id: 'set', label: 'Pengaturan' }]).filter(function (x) { return x.id === tab; })[0];
    $('viewTitle').textContent = t ? t.label : '';
    Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
    $('view').innerHTML = '';
    window.scrollTo(0, 0);
    VIEWS[tab]();
  },
  akunSaya: function () {
    if (S.dev) {
      UI.open('Mode pengembangan', '<div class="notice">Aplikasi berjalan <b>tanpa login</b>. Untuk mengaktifkan login, ubah <code>TANPA_LOGIN = false</code> di Code.gs lalu terbitkan ulang.</div>' +
        '<div class="field"><label>Coba tampilan sebagai peran</label><select id="devPeran">' + opt([['ADMIN', 'Admin'], ['SPV', 'Spv'], ['OPERATOR', 'Operator'], ['KASIR', 'Kasir'], ['PEMILIK', 'Pemilik']], S.user.peran) + '</select></div>' +
        '<div class="modal-foot"><button class="btn" onclick="UI.close()">Tutup</button><button class="btn btn-primary" onclick="App.gantiPeran()">Ganti peran</button></div>');
      return;
    }
    UI.open('Akun saya', '<p><b>' + esc(S.user.nama) + '</b> (' + esc(S.user.kode) + ') · ' + esc(S.user.peran) + '</p>' +
      '<h3 style="margin:14px 0 8px;font-size:14px">Ganti PIN</h3><div class="grid2"><div class="field"><label>PIN lama</label><input id="pinL" type="password" inputmode="numeric"></div><div class="field"><label>PIN baru (4–8 angka)</label><input id="pinB" type="password" inputmode="numeric"></div></div>' +
      '<div class="modal-foot"><button class="btn btn-danger" onclick="App.logout()">' + IC.out + ' Keluar</button><button class="btn btn-primary" onclick="App.gantiPin()">Simpan PIN</button></div>');
  },
  gantiPeran: function () {
    S.devPeran = val('devPeran'); S.sub = {}; UI.close(); App.init();
  },
  gantiPin: function () {
    call('gantiPin', { pinLama: val('pinL'), pinBaru: val('pinB') }).then(function (m) { UI.close(); UI.toast(m); }).catch(gagal);
  },
  logout: function (diam) {
    if (S.token) google.script.run.logout(S.token);
    try { sessionStorage.removeItem('dcr_token'); } catch (e) { }
    S.token = null; UI.close();
    $('app').hidden = true; $('login').hidden = false; $('lgPin').value = '';
    $('loginForm').onsubmit = App.login;
    if (diam) $('lgErr').textContent = 'Sesi berakhir, silakan login lagi.';
    if (S.dev) App.init();
  }
};

var TABS = [
  { id: 'pos', label: 'POS', short: 'POS', icon: 'pos', need: 'posDaftar' },
  { id: 'jurnal', label: 'Jurnal Umum', short: 'Jurnal', icon: 'jurnal', need: 'jurnalDaftar' },
  { id: 'bb', label: 'Buku Besar', short: 'Buku Besar', icon: 'bb', need: 'bukuBesar' },
  { id: 'lr', label: 'Laba Rugi', short: 'Laba Rugi', icon: 'lr', need: 'laporan' },
  { id: 'neraca', label: 'Neraca', short: 'Neraca', icon: 'neraca', need: 'laporan' }
];

function subtabs(key, list) {
  list = list.filter(function (x) { return !x.need || can(x.need); });
  if (!S.sub[key] || !list.some(function (x) { return x.id === S.sub[key]; })) S.sub[key] = list[0].id;
  return '<div class="subtabs noprint">' + list.map(function (x) {
    return '<button class="' + (S.sub[key] === x.id ? 'on' : '') + '" onclick="S.sub[\'' + key + '\']=\'' + x.id + '\';App.go(S.tab)">' + esc(x.label) + '</button>';
  }).join('') + '</div>';
}
function periodeForm(prefix, dari, sampai, fn, extra) {
  return '<div class="card noprint"><div class="row">' +
    '<div class="field"><label>Dari</label><input type="date" id="' + prefix + 'Dari" value="' + dari + '"></div>' +
    '<div class="field"><label>Sampai</label><input type="date" id="' + prefix + 'Sampai" value="' + sampai + '"></div>' +
    (extra || '') + '<button class="btn btn-primary" onclick="' + fn + '">Tampilkan</button></div></div>';
}

/* =========================================================
   VIEWS
   ========================================================= */
var VIEWS = {};

/* ---------------- POS ---------------- */
var POS = {
  menuAktif: function () { return S.boot.menu.filter(function (m) { return m.aktif === 'YA'; }); },
  hitung: function () {
    var subH = 0, subA = 0;
    S.cart.forEach(function (c) { var s = c.qty * c.harga; if (c.kelompok === 'ALKOHOL') subA += s; else subH += s; });
    var pb1 = Number(S.boot.pengaturan.TARIF_PB1) || 0, sv = Number(S.boot.pengaturan.TARIF_SERVICE) || 0;
    var sub = subH + subA, disk = Math.min(Math.max(0, S.pos.diskon || 0), sub);
    var dA = sub ? Math.round(disk * subA / sub) : 0, dH = disk - dA;
    var nH = subH - dH, nA = subA - dA;
    var sH = Math.round(nH * sv / 100), sA = Math.round(nA * sv / 100);
    var pH = Math.round((nH + sH) * pb1 / 100), pA = Math.round((nA + sA) * pb1 / 100);
    return { subH: subH, subA: subA, diskon: disk, service: sH + sA, pajak: pH + pA, total: nH + nA + sH + sA + pH + pA, pb1: pb1, sv: sv };
  },
  tambah: function (id) {
    var m = S.boot.menu.filter(function (x) { return x.id === id; })[0];
    var c = S.cart.filter(function (x) { return x.id === id; })[0];
    if (c) c.qty++; else S.cart.push({ id: m.id, nama: m.nama, harga: m.harga, kelompok: m.kelompok, qty: 1 });
    POS.renderCart();
  },
  qty: function (id, d) {
    var c = S.cart.filter(function (x) { return x.id === id; })[0];
    if (!c) return; c.qty += d;
    if (c.qty <= 0) S.cart = S.cart.filter(function (x) { return x.id !== id; });
    POS.renderCart();
  },
  renderMenu: function () {
    var list = POS.menuAktif().filter(function (m) {
      return (S.posKat === 'Semua' || m.kategori === S.posKat) && (!S.posCari || m.nama.toLowerCase().indexOf(S.posCari.toLowerCase()) >= 0);
    });
    $('menuGrid').innerHTML = list.length ? list.map(function (m) {

var JR = {
  akunOpts: function (kel) {
    return S.boot.akun.filter(function (a) { return a.aktif === 'YA' && (kel === 'ALKOHOL' ? a.kelompok !== 'HALAL' : a.kelompok !== 'ALKOHOL'); })
      .map(function (a) { return [a.kode, a.kode + ' · ' + a.nama]; });
  },
  kontakOpts: function () { return [['', '—']].concat(S.boot.kontak.filter(function (k) { return k.aktif === 'YA'; }).map(function (k) { return [k.kode, k.kode + ' · ' + k.nama]; })); },
  daftar: function () {
    S.last.jf = { dari: val('jDari'), sampai: val('jSampai'), kelompok: val('jKel'), cari: val('jCari') };

      $('jHasil').innerHTML = '<div class="card-head"><span class="muted">' + r.jumlah + ' jurnal · Debit ' + rp(r.total.debit) + ' · Kredit ' + rp(r.total.kredit) + '</span>' +
        '<button class="btn btn-sm noprint" onclick="JR.csv()">' + IC.dl + ' Excel</button></div>' +
        (r.jurnal.length ? r.jurnal.map(JR.kartu).join('') : '<div class="empty">Tidak ada jurnal di periode ini.</div>');
      S.last.jurnal = r.jurnal;
    }).catch(gagal);
  },
  kartu: function (j) {
    var bisaUbah = j.sumber !== 'POS' && j.sumber !== 'POS_VOID' && (S.user.peran !== 'OPERATOR' || (j.opr === S.user.kode && String(j.dibuat).slice(0, 10) === today()));
    var edit = bisaUbah && can('jurnalSimpan') && (j.sumber === 'MANUAL' || j.sumber === 'PEMBELIAN_ALKOHOL');
    var hapus = bisaUbah && can('jurnalHapus');
    return '<div class="jr"><div class="jr-head"><span class="jr-id">' + esc(j.id) + '</span>' + kelBadge(j.kelompok) + '<span class="small muted">' + tglID(j.tanggal) + ' · ' + esc(j.opr) + ' · ' + esc(j.sumber.replace('_', ' ')) + '</span>' +
      '<span class="jr-ket">' + esc(j.keterangan) + '</span><span class="jr-act noprint">' +
      (edit ? '<button class="btn btn-sm" onclick="JR.edit(\'' + esc(j.id) + '\')">Edit</button>' : '') +
      (hapus ? '<button class="btn btn-sm btn-danger" onclick="JR.hapus(\'' + esc(j.id) + '\')">Hapus</button>' : '') + '</span></div>' +
      '<div class="tbl-wrap"><table>' + j.baris.map(function (b) {

      .then(function (r) { UI.toast(r.baris + ' barang tersimpan, total ' + rp(r.total)); JR.muatStok(); }).catch(gagal);
  }
};

      '<div class="tbl-wrap"><table><tr><th style="min-width:260px">Akun</th><th style="min-width:160px">Kontak (opsional)</th><th class="num" style="min-width:150px">Saldo</th><th></th></tr>' +
      S.saldo.map(function (s, i) {
        return '<tr><td><select id="saA' + i + '"' + (ro ? ' disabled' : '') + ' onchange="SET.totSaldo()"><option value="">— pilih —</option>' + opt(ak, s.kode) + '</select></td><td><select id="saK' + i + '"' + (ro ? ' disabled' : '') + '>' + opt(JR.kontakOpts(), s.kontak) + '</select></td>' +
          '<td>' + moneyInput('saS' + i, s.saldo).replace('oninput="', 'oninput="SET.totSaldo();') + '</td><td>' + (ro ? '' : '<button class="icon-btn" aria-label="Hapus baris" onclick="SET.syncSaldo();S.saldo.splice(' + i + ',1);SET.renderSaldo()">✕</button>') + '</td></tr>';
      }).join('') + '</table></div>' +
      '<p id="saBal" style="margin:10px 0"></p>' +
      (ro ? '' : '<div class="row"><button class="btn btn-sm" onclick="SET.syncSaldo();S.saldo.push({kode:\'\',kontak:\'\',saldo:0});SET.renderSaldo()">' + IC.plus + ' Baris</button><button class="btn btn-primary" onclick="SET.simpanSaldo()">Simpan saldo awal</button></div>');
    SET.totSaldo();
  },
  syncSaldo: function () { S.saldo = S.saldo.map(function (s, i) { return { kode: val('saA' + i), kontak: val('saK' + i), saldo: num(val('saS' + i)) }; }); },
  totSaldo: function () {
    var td = 0, tk = 0;
    S.saldo.forEach(function (s, i) { var a = akun(val('saA' + i)); var n = num(val('saS' + i)); if (!a) return; if ((a.normal === 'DEBIT') === (n >= 0)) td += Math.abs(n); else tk += Math.abs(n); });
    $('saBal').innerHTML = 'Debit ' + rp(td) + ' · Kredit ' + rp(tk) + ' ' + (td === tk ? '<span class="badge b-ok">Seimbang</span>' : '<span class="badge b-bad">Selisih ' + nf(td - tk) + '</span>');
  },
  simpanSaldo: function () {
    SET.syncSaldo();
    call('saldoAwalSimpan', { saldo: S.saldo }).then(function () { UI.toast('Saldo awal tersimpan.'); SET.saldo(); }).catch(gagal);
  },
  pengguna: function () {
    call('penggunaDaftar').then(function (list) {
      S.users = list;
      $('setBody').innerHTML = '<div class="card-head"><span class="muted small">Peran: Kasir (POS), Operator (input jurnal), Spv, Admin (semua), Pemilik (lihat semua & kelola pengguna).</span><button class="btn btn-primary btn-sm" onclick="SET.formUser()">' + IC.plus + ' Pengguna</button></div>' +
        '<div class="tbl-wrap"><table><tr><th>Kode</th><th>Nama</th><th>Peran</th><th>Aktif</th></tr>' + list.map(function (u) {
          return '<tr class="click" onclick="SET.formUser(\'' + esc(u.kode) + '\')"><td>' + esc(u.kode) + '</td><td>' + esc(u.nama) + '</td><td>' + esc(u.peran) + '</td><td>' + esc(u.aktif) + '</td></tr>';
        }).join('') + '</table></div>';
    }).catch(gagal);
  },
  formUser: function (kode) {
    var u = kode ? (S.users || []).filter(function (x) { return x.kode === kode; })[0] || {} : {};
    var nama = u.nama, peran = u.peran, aktif = u.aktif;
    UI.open(kode ? 'Ubah pengguna ' + kode : 'Pengguna baru', '<div class="grid2"><div class="field"><label>Kode (OPR)</label><input id="fuKode" value="' + esc(kode || '') + '" maxlength="6"' + (kode ? ' disabled' : '') + '></div><div class="field"><label>Nama</label><input id="fuNama" value="' + esc(nama || '') + '"></div>' +
      '<div class="field"><label>Peran</label><select id="fuPeran">' + opt([['KASIR', 'Kasir'], ['OPERATOR', 'Operator'], ['SPV', 'Spv'], ['ADMIN', 'Admin'], ['PEMILIK', 'Pemilik']], peran || 'KASIR') + '</select></div>' +
      '<div class="field"><label>' + (kode ? 'PIN baru (kosongkan bila tetap)' : 'PIN (4–8 angka)') + '</label><input id="fuPin" type="password" inputmode="numeric"></div>' +
      '<div class="field"><label>Aktif</label><select id="fuAktif">' + opt([['YA', 'YA'], ['TIDAK', 'TIDAK']], aktif || 'YA') + '</select></div></div>' +
      '<div class="modal-foot"><button class="btn" onclick="UI.close()">Batal</button><button class="btn btn-primary" onclick="SET.simpanUser()">Simpan</button></div>');
  },
  simpanUser: function () {
    call('penggunaSimpan', { kode: val('fuKode'), nama: val('fuNama'), peran: val('fuPeran'), pin: val('fuPin'), aktif: val('fuAktif') })
      .then(function () { UI.close(); SET.pengguna(); UI.toast('Pengguna tersimpan.'); }).catch(gagal);
  },
  log: function () {
    call('logDaftar').then(function (list) {
      $('setBody').innerHTML = '<div class="tbl-wrap"><table><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Detail</th></tr>' + list.map(function (l) {
        return '<tr><td style="white-space:nowrap">' + esc(l.waktu) + '</td><td>' + esc(l.user) + '</td><td>' + esc(l.aksi) + '</td><td class="small" style="max-width:420px;word-break:break-word">' + esc(String(l.detail).slice(0, 300)) + '</td></tr>';
      }).join('') + '</table></div>';
    }).catch(gagal);
  }
};

VIEWS.set = function () {
  var html = subtabs('set', [
    { id: 'profil', label: 'Profil resto', need: 'penggunaDaftar' },
    { id: 'akun', label: 'Akun', need: 'akunSimpan' },
    { id: 'menu', label: 'Menu', need: 'menuSimpan' },
    { id: 'kontak', label: 'Kontak', need: 'kontakSimpan' },
    { id: 'saldo', label: 'Saldo awal', need: 'saldoAwalDaftar' },
    { id: 'pengguna', label: 'Pengguna', need: 'penggunaDaftar' },
    { id: 'log', label: 'Log aktivitas', need: 'logDaftar' }
  ]);
  $('view').innerHTML = html + '<div class="card" id="setBody"></div>';
  SET[S.sub.set]();
};

document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').hidden) UI.close(); });
$('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') UI.close(); });
App.init();
</script>
